
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Christmas Tree | Cloud Spatial Experience</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --cream: #fceea7;
            --black: #050505;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--black);
            font-family: 'Quicksand', sans-serif;
            user-select: none;
            touch-action: none;
        }

        /* Login Overlay */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s cubic-bezier(0.86, 0, 0.07, 1);
        }

        #auth-overlay.hidden {
            transform: translateY(-100%);
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .login-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: white;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }

        /* UI Layer */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .ui-hidden { opacity: 0 !important; }

        .cloud-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 10px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--glass);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: auto;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(28px, 6vw, 48px);
            text-align: center;
            margin-top: 60px;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        .controls-area {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-glass {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 35px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .btn-glass:hover {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.05);
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--black);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 300;
            transition: opacity 0.8s;
        }

        .webcam-container { opacity: 0; position: absolute; pointer-events: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@^0.182.0",
    "three/": "https://esm.sh/three@^0.182.0/",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@^0.10.22-rc.20250304",
    "@neondatabase/serverless": "https://esm.sh/@neondatabase/serverless@^1.0.2"
  }
}
</script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="color: var(--gold); font-family: 'Cinzel'; margin-top:20px;">WAKING THE MAGIC...</div>
    </div>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="login-card">
            <h2>Enter the Forest</h2>
            <input type="text" id="username-input" class="login-input" placeholder="Your Name" value="Guest">
            <button id="login-btn" class="btn-glass">Enter Cloud Sync</button>
            <p style="color: rgba(255,255,255,0.4); font-size: 10px; margin-top: 20px;">Your memories will be stored on Vercel Cloud</p>
        </div>
    </div>

    <div id="ui-container">
        <div id="status-bar" class="cloud-status">Cloud: Disconnected</div>
        <h1>Merry Christmas</h1>
        
        <div class="controls-area">
            <label for="file-input" class="btn-glass">Upload Memory</label>
            <input type="file" id="file-input" accept="image/*" style="display:none">
            <div style="color: rgba(255,255,255,0.5); font-size: 10px;">Pinch to View Random Memory</div>
        </div>
    </div>

    <div class="webcam-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
