<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Christmas Tree | AI Spatial Experience</title>
    
    <!-- Visual Identity & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New_Roman:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --cream: #fceea7;
            --black: #000000;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--black);
            font-family: 'Times New Roman', serif;
            user-select: none;
            -webkit-touch-callout: none; /* iOS Safari */
            -webkit-user-select: none; /* Safari */
            touch-action: none; /* Prevent scrolling/zooming gestures */
        }

        /* UI Layer */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass to canvas if needed */
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(32px, 8vw, 56px); /* Responsive font size */
            text-align: center;
            margin-top: 40px;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
            letter-spacing: 4px;
            pointer-events: auto;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .controls-area {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .upload-wrapper input[type="file"] {
            display: none;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block;
            border-radius: 4px;
        }

        .btn-glass:hover, .btn-glass:active {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .hint-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-top: 10px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loader-text {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 3px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Hidden Webcam for CV */
        .webcam-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0; /* Invisible per spec */
            pointer-events: none;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "three/": "https://esm.sh/three@^0.182.0/",
    "three": "https://esm.sh/three@^0.182.0",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@^0.10.22-rc.20250304"
  }
}
</script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <!-- Main UI -->
    <div id="ui-container">
        <h1>Merry Christmas</h1>
        
        <div class="controls-area">
            <div class="upload-wrapper">
                <label for="file-input" class="btn-glass">Add Memories</label>
                <input type="file" id="file-input" accept="image/*">
            </div>
            <div class="hint-text">Tap screen to Toggle UI • Press 'H' to Hide</div>
        </div>
    </div>

    <!-- Hidden CV Elements -->
    <div class="webcam-container">
        <!-- Added 'muted' which is required for autoplay on many mobile browsers -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="cv-canvas" width="160" height="120"></canvas>
    </div>

    <!-- Safety Failsafe: Remove loader if app crashes -->
    <script>
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader && loader.style.opacity !== '0') {
                console.warn("Safety timeout: Removing loader forcefully.");
                loader.style.opacity = '0';
                loader.style.pointerEvents = 'none';
                setTimeout(() => loader.remove(), 1000);
            }
        }, 5000);
    </script>

    <!-- App Entry -->
    <script type="module" src="/index.tsx"></script>
</body>
</html>
